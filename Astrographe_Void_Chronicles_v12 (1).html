<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080e18">
<title>Astrographe: Void Chronicles — v12</title>
<style>
:root{--bg:#080e18;--panel:#101d2b;--line:#426176;--cyan:#8bd8df;--muted:#7896a6}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#dce8e8;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;touch-action:manipulation}
body{display:flex;justify-content:center;align-items:center}
#game{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.78vw);max-height:100dvh;aspect-ratio:9/16;background:#080e18;overflow:hidden;border-left:1px solid #203849;border-right:1px solid #203849}
canvas{width:100%;height:100%;display:block;touch-action:none}
#topbar{position:absolute;top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;font-size:9px;letter-spacing:1px;color:#b4d4d7;text-shadow:0 1px #000}
.pill{background:#091521e8;border:1px solid #345063;padding:6px 8px}
#bottom{position:absolute;left:9px;right:9px;bottom:calc(env(safe-area-inset-bottom,8px) + 9px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
button{font:inherit;color:#d7eeee;background:#102333;border:1px solid #527386;border-radius:6px;padding:8px 6px;min-height:39px;letter-spacing:.3px;box-shadow:0 3px 0 #050a10;font-size:10px;touch-action:none;user-select:none;-webkit-user-select:none}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #050a10;background:#1d3b4c}
button[hidden]{display:none!important}
#hint{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,8px) + 111px);text-align:center;color:#a4c4c9;font-size:9px;line-height:1.4;text-shadow:0 2px #000;pointer-events:none}
#panel{position:absolute;inset:7% 5%;background:#0a1420f5;border:2px solid #567386;box-shadow:0 0 0 4px #07101a,0 0 30px #000;display:none;padding:14px;overflow:auto;z-index:5}
#panel h2{font-size:15px;color:var(--cyan);font-weight:normal;letter-spacing:2px;margin:4px 0 12px}
#panel p{font-size:12px;line-height:1.6;color:#bfd0d2}
#panel .close{width:100%;margin-top:14px;min-height:44px}
#panel textarea{width:100%;background:#101d28;border:1px solid #456174;color:#e0eeee;padding:10px;font:12px monospace;margin:6px 0;min-height:110px;resize:vertical}
.entry{border:1px solid #344d5c;padding:10px;margin:8px 0;background:#0d1b28}
.small{font-size:10px;color:#8daab5}
.stat{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #45606d;padding:7px 0;font-size:11px}
#toast{position:absolute;top:17%;left:12%;right:12%;text-align:center;background:#0b1925ed;border:1px solid #64899a;padding:10px;font-size:11px;color:#c7ecec;display:none;z-index:7}
@media(max-height:650px){#bottom{gap:4px;bottom:5px}button{min-height:34px;padding:5px;font-size:9px}#hint{bottom:calc(env(safe-area-inset-bottom,5px) + 94px)}}
.pill{border-radius:6px;backdrop-filter:blur(4px)}#toast,#panel{animation:fade .25s ease}@keyframes fade{from{opacity:0}to{opacity:1}}
@media (orientation:landscape) and (max-height:700px){
:root{--side:calc((100vw - 56.25dvh)/2 - 18px);--bw:calc((var(--side) - 34px)/2);--lo:max(8px,env(safe-area-inset-left));--ro:max(10px,env(safe-area-inset-right))}
#game{width:100vw;height:100vh;height:100dvh;max-height:none;aspect-ratio:auto;border:0}
canvas{position:absolute;top:0;left:50%;transform:translateX(-50%);height:100%;width:calc(100vh*.5625);width:calc(100dvh*.5625)}
#topbar{left:calc(50% - 28dvh + 6px);right:calc(50% - 28dvh + 6px)}
#bottom{display:contents}
#bottom button{position:absolute;right:var(--ro);width:var(--bw);height:46px;min-height:46px;padding:4px;font-size:10px;line-height:1.15}
#flyBtn,#walkBtn,#cabinBtn,#landBtn,#walkExitBtn,#takeoffBtn{bottom:166px}
#prevPlanetBtn,#nextPlanetBtn{bottom:114px}
#scanBtn,#terminalBtn{bottom:62px}
#noteBtn{bottom:10px}
#flyBtn,#cabinBtn,#walkExitBtn,#takeoffBtn,#prevPlanetBtn,#scanBtn,#noteBtn{right:calc(var(--ro) + var(--bw) + 8px)}
#interactBtn{bottom:114px;right:var(--ro);width:calc(var(--bw)*2 + 8px);font-size:9px}
#forwardBtn,#backBtn,#leftBtn,#rightBtn,#thrustBtn,#brakeBtn{right:auto;width:86px;height:54px;min-height:54px}
#forwardBtn{left:calc(var(--side)/2 - 35px);bottom:122px}
#backBtn{left:calc(var(--side)/2 - 35px);bottom:6px}
#leftBtn{left:var(--lo);bottom:64px}
#rightBtn{left:calc(var(--side) - 78px);bottom:64px}
#thrustBtn{left:var(--lo);bottom:84px;width:calc(var(--side) - 8px);height:80px}
#brakeBtn{left:var(--lo);bottom:8px;width:calc(var(--side) - 8px);height:66px}
#hint{top:40px;bottom:auto;left:var(--lo);right:auto;width:calc(var(--side) - 8px);text-align:left}
#toast{left:calc(50% - 25dvh);right:calc(50% - 25dvh);top:14%}
#panel{inset:4% 14%}
}
</style>
</head>
<body>
<div id="game">
 <canvas id="view" width="240" height="426" aria-label="Вид из исследовательского корабля"></canvas>
 <div id="topbar"><div class="pill">ASTROGRAPHE / 12</div><div class="pill" id="clock">SHIP TIME 00:00</div></div>
 <div id="hint">КАБИНА: выберите действие</div>
 <div id="bottom">
  <button id="flyBtn">ПОЛЁТ</button>
  <button id="prevPlanetBtn">◀ ПРЕДЫДУЩАЯ</button>
  <button id="nextPlanetBtn">СЛЕДУЮЩАЯ ▶</button>
  <button id="cabinBtn" hidden>КАБИНА</button>
  <button id="walkBtn">ПРОГУЛКА ПО КОРАБЛЮ</button>
  <button id="landBtn" hidden>ВЫСАДИТЬСЯ НА ПЛАНЕТУ</button>
  <button id="takeoffBtn" hidden>ВЕРНУТЬСЯ НА КОРАБЛЬ</button>
  <button id="walkExitBtn" hidden>ВЕРНУТЬСЯ В КАБИНУ</button>
  <button id="interactBtn" hidden>ОСМОТРЕТЬ ПРЕДМЕТ</button>
  <button id="scanBtn">СКАНЕР</button>
  <button id="noteBtn">БЛОКНОТ</button>
  <button id="terminalBtn">ТЕРМИНАЛ</button>
  <button id="thrustBtn" hidden>УДЕРЖИВАТЬ: ТЯГА +</button>
  <button id="brakeBtn" hidden>УДЕРЖИВАТЬ: ТОРМОЗ</button>
  <button id="forwardBtn" hidden>▲ ВПЕРЁД</button>
  <button id="backBtn" hidden>▼ НАЗАД</button>
  <button id="leftBtn" hidden>◀ ВЛЕВО</button>
  <button id="rightBtn" hidden>ВПРАВО ▶</button>
 </div>
 <div id="toast"></div>
 <div id="panel"><div id="panelContent"></div><button class="close" id="closeBtn">ЗАКРЫТЬ</button></div>
</div>
<script>
const LS=(()=>{try{localStorage.setItem("_t","1");localStorage.removeItem("_t");return localStorage}catch(e){const m={};return{getItem:k=>(k in m?m[k]:null),setItem:(k,v)=>{m[k]=String(v)}}}})();
(()=>{
'use strict';
const canvas=document.getElementById('view');
const ctx=canvas.getContext('2d');
const W=240,H=426;let S=1;
function fit(){const dpr=Math.min(window.devicePixelRatio||1,3);S=Math.min(4,Math.max(1,canvas.clientWidth*dpr/W));canvas.width=Math.round(W*S);canvas.height=Math.round(H*S);ctx.setTransform(S,0,0,S,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';}
fit();window.addEventListener('resize',fit);
const $=id=>document.getElementById(id);
let mode='cabin',seconds=0,frame=0,planetFound=false,scanCount=0;
const planets=[
 {name:'KEPLER-186 f',type:'КАМЕНИСТАЯ',kind:'rock',colors:['#172b42','#365b70','#6b8b91'],sky:['#101e36','#b17e68'],ground:'#514b45',land:true,info:'Каменистый мир с прохладной поверхностью. Атмосфера и состав требуют дополнительного анализа.'},
 {name:'VESPER-4',type:'ЛЕДЯНАЯ',kind:'ice',colors:['#233b58','#77a9bb','#d3e4df'],sky:['#142b45','#9ab9c5'],ground:'#9eb8bd',land:true,info:'Ледяная планета с широкими замёрзшими равнинами и трещинами в коре.'},
 {name:'CINDER-9',type:'ПУСТЫННАЯ',kind:'desert',colors:['#452b27','#a65c3d','#e3b16e'],sky:['#39252b','#d18b61'],ground:'#9a6348',land:true,info:'Сухой мир с красноватыми породами, пылевыми полями и резкими перепадами температуры.'},
 {name:'PELAGIA',type:'ОКЕАНИЧЕСКАЯ',kind:'ocean',colors:['#102d4c','#176f91','#70c3c7'],sky:['#12334d','#7bb4bd'],ground:'#176078',land:true,info:'Планета с глобальным океаном. Сканер отмечает облачные системы и крупные течения.'},
 {name:'MYCEL-12',type:'БОЛОТНАЯ',kind:'swamp',colors:['#1d3028','#526e48','#9aa56a'],sky:['#182d2b','#8d9a70'],ground:'#46533b',land:true,info:'Влажный мир с тёмными низинами, туманом и необычными минеральными отложениями.'},
 {name:'AURELIA',type:'ГАЗОВЫЙ ГИГАНТ',kind:'gas',colors:['#4b2e49','#b27a83','#e5c69b'],sky:['#28223e','#b58b9b'],ground:'#4b3c55',land:false,info:'Газовый гигант с полосатой атмосферой. Твёрдой поверхности для посадки нет.'},
 {name:'NOCTIS',type:'ТЁМНЫЙ КАМЕНИСТЫЙ МИР',kind:'dark',colors:['#101b2a','#33475b','#71808b'],sky:['#0b1423','#596b7d'],ground:'#303c48',land:true,info:'Холодная планета с тёмной корой и редкими отражающими минералами.'},
 {name:'THALASSA',type:'ЛЕДЯНОЙ ОКЕАН',kind:'iceocean',colors:['#16374a','#43879a','#b4e1dd'],sky:['#18384a','#9cc9c8'],ground:'#477f8a',land:true,info:'Под ледяной корой предположительно скрывается жидкий океан.'},
 {name:'RUBRA',type:'ЖЕЛЕЗИСТАЯ ПЛАНЕТА',kind:'iron',colors:['#3a1d20','#853c35','#d17a55'],sky:['#2b1a25','#a75b4a'],ground:'#754239',land:true,info:'Планета с высоким содержанием железистых пород и красной пылью.'},
 {name:'SYLVA-3',type:'ЗЕЛЁНЫЙ КАМЕНИСТЫЙ МИР',kind:'green',colors:['#1d3b34','#4d7958','#a0b77c'],sky:['#193c3d','#a3b58a'],ground:'#536b4b',land:true,info:'Мир с обширными зелёными минеральными равнинами и плотной облачностью.'}
];
let targetIndex=0,surfacePlanetIndex=0;
const activePlanet=()=>planets[targetIndex];
let notes=LS.getItem('astro_notes')||'Первое наблюдение. Сектор кажется совершенно пустым...';
let yaw=0,pitch=0,speed=0,distance=.92,thrusting=false,braking=false;
let landed=false,walkX=2.5,walkY=5.5,walkAngle=0,walkForward=false,walkBack=false,walkLeft=false,walkRight=false;
let surfaceX=0,surfaceZ=0,surfaceForward=false,surfaceBack=false,surfaceLeft=false,surfaceRight=false;
const shipMap=[
 '############',
 '#..........#',
 '#.####.###.#',
 '#....#.....#',
 '###..#.###.#',
 '#....#.....#',
 '#.######.#.#',
 '#..........#',
 '#..........#',
 '############'
 ];
let dragPointer=null,lastPointerX=0,lastPointerY=0,toastTimer;
const stars=Array.from({length:125},(_,i)=>({x:((i*73+19)%200-100)/100,y:((i*137+31)%180-90)/90,z:.25+((i*47)%150)/100,size:i%11===0?2:1}));

function rect(x,y,w,h,c){const x0=Math.round(x*S)/S,y0=Math.round(y*S)/S;ctx.fillStyle=c;ctx.fillRect(x0,y0,Math.round((x+w)*S)/S-x0,Math.round((y+h)*S)/S-y0);}
function line(x,y,x2,y2,c){ctx.strokeStyle=c;ctx.lineWidth=.8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();}
function txt(t,x,y,c='#b7d5d9',size=7){ctx.fillStyle=c;ctx.font=`${size}px ui-monospace,Menlo,Consolas,monospace`;ctx.fillText(t,x,y);}
function showToast(message){const el=$('toast');el.textContent=message;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',2200);}
function openPanel(html){$('panelContent').innerHTML=html;$('panel').style.display='block';}
function closePanel(){$('panel').style.display='none';}

function drawCabin(){
 rect(0,0,W,H,'#080f1b');
 // Иллюминатор и космос за ним
 rect(9,27,222,194,'#263b4b');rect(13,31,214,186,'#070d17');rect(17,35,206,178,'#0a1422');
 stars.forEach((s,i)=>{const x=(s.x*80+120+Math.sin(frame*.008+i)*1.5+240)%240;const y=(s.y*65+115)%205;ctx.fillStyle='#a8d1dc';ctx.globalAlpha=.6+.4*Math.sin(frame*.03+i);ctx.beginPath();ctx.arc(x,y,s.size*.55,0,6.283);ctx.fill();ctx.globalAlpha=1;});
 drawPlanet(169,126,37,targetIndex);
 rect(115,27,10,194,'#314b5b');rect(9,108,222,7,'#314b5b');rect(17,35,2,178,'#66818a');rect(221,35,2,178,'#66818a');
 rect(0,0,240,25,'#172735');rect(0,222,240,204,'#101d29');rect(0,222,240,5,'#314654');
 rect(0,245,240,66,'#1b2d39');rect(7,251,226,52,'#0b1721');
 rect(14,258,58,31,'#18313a');rect(17,261,52,25,'#0a1a24');txt('TELEMETRY',21,269,'#78b9c0',5);
 for(let i=0;i<6;i++){const h=3+4*Math.abs(Math.sin(frame*.03+i*1.3));rect(21+i*7,283-h,3,h,'#54818b');}
 rect(88,254,64,38,'#263e49');rect(92,258,56,29,'#0c1c27');txt('SPECTROMETER',96,266,'#8ed0d0',5);
 for(let i=0;i<9;i++)line(96+i*5,280,96+i*5,274-(i%4)*3,'#74c0c5');
 rect(168,258,57,31,'#18313a');rect(171,261,51,25,'#0a1a24');txt('NAV / ORBIT',176,269,'#78b9c0',5);line(177,279,216,279,'#456d7a');line(177,275,207,275,'#456d7a');
 for(let i=0;i<5;i++)rect(18+i*12,236,4,3,i===1?'#d3b878':'#548b8c');
 rect(0,312,240,114,'#182733');rect(0,316,240,4,'#3d5662');rect(19,326,202,79,'#101a22');rect(23,330,194,71,'#1a2a34');
 rect(73,335,94,56,'#8d896e');rect(77,339,86,48,'#c4bea2');line(120,339,120,387,'#797966');
 for(let i=0;i<4;i++)line(83,348+i*8,113,348+i*8,'#8e927f');txt('FIELD LOG',87,344,'#45565a',5);
 rect(8,365,42,21,'#283e49');rect(190,365,42,21,'#283e49');for(let i=0;i<4;i++)rect(14+i*8,371,4,5,'#678a8d');
 txt('O₂  98%',13,413,'#8bd8df',7);txt(`POWER  ${Math.round(power)}%`,169,413,'#8bd8df',7);txt('DEEP SPACE OBSERVATORY',59,17,'#6f939f',6);txt(`TARGET: ${activePlanet().name}`,12,232,'#9bbdc3',6);
}
function hexRgb(hex){return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}
function mixColor(a,b,t){const A=hexRgb(a),B=hexRgb(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`;}
function noise2(x,y,seed){let n=Math.sin(x*12.9898+y*78.233+seed*37.719)*43758.5453;return n-Math.floor(n);}
const sprites={};
function hash3(x,y,z,s){const n=Math.sin(x*127.1+y*311.7+z*74.7+s*53.3)*43758.5453;return n-Math.floor(n);}
function vnoise(x,y,z,s){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);let r=0;for(let a=0;a<2;a++)for(let b=0;b<2;b++)for(let c=0;c<2;c++)r+=hash3(xi+a,yi+b,zi+c,s)*(a?u:1-u)*(b?v:1-v)*(c?w:1-w);return r;}
function fbm(x,y,z,s){let v=0,a=.5;for(let i=0;i<4;i++){v+=a*vnoise(x,y,z,s);x*=2.03;y*=2.03;z*=2.03;a*=.5;}return v;}
// Гладкая планета: рельеф по 3D-шуму, освещение и атмосфера считаются попиксельно один раз и кэшируются.
function makeSprite(index){
 const p=planets[index],c=p.colors.map(hexRgb),N=360,cv=document.createElement('canvas');cv.width=cv.height=N;
 const g=cv.getContext('2d'),img=g.createImageData(N,N),d=img.data,R=N/2-2;
 for(let j=0;j<N;j++)for(let i=0;i<N;i++){
  const nx=(i-N/2+.5)/R,ny=(j-N/2+.5)/R,q=nx*nx+ny*ny;if(q>1.02)continue;
  const nz=Math.sqrt(Math.max(0,1-q)),k=(j*N+i)*4,sx=nx*2.2+index*7,sy=ny*2.2,sz=nz*2.2;
  let t=fbm(sx,sy,sz,index);
  if(p.kind==='gas')t=.5+.5*Math.sin(ny*9+fbm(sx*.6,sy*.6,sz*.6,index)*5);
  else if(p.kind==='ice'||p.kind==='iceocean')t=Math.min(1,t*.7+(1-Math.abs(fbm(sx*1.5,sy*1.5,sz*1.5,index+3)*2-1))*.45);
  else if(p.kind==='ocean')t=fbm(sx,sy*2,sz,index)>.52?.8:.15+t*.3;
  const lit=Math.max(0,-nx*.48-ny*.30+nz*.83),sh=.16+.84*Math.pow(lit,.8),rim=Math.pow(1-nz,3);
  const A=t<.5?c[0]:c[1],B=t<.5?c[1]:c[2],m=t<.5?t*2:(t-.5)*2;
  for(let ch=0;ch<3;ch++)d[k+ch]=Math.min(255,(A[ch]+(B[ch]-A[ch])*m)*sh+rim*[120,200,215][ch]*(.25+lit*.75));
  d[k+3]=Math.round(255*Math.max(0,Math.min(1,(1-Math.sqrt(q))*R/1.2+.5)));
 }
 g.putImageData(img,0,0);return cv;
}
const getSprite=i=>sprites[i]||(sprites[i]=makeSprite(i));
let warm=0;(function pre(){if(warm<planets.length){getSprite(warm++);setTimeout(pre,40);}})();
function drawPlanet(x,y,r,index=targetIndex){
 const p=planets[index]||planets[0];
 const hg=ctx.createRadialGradient(x,y,r*.9,x,y,r*1.7);hg.addColorStop(0,'rgba(130,211,222,.22)');hg.addColorStop(1,'rgba(130,211,222,0)');ctx.fillStyle=hg;ctx.fillRect(x-r*1.8,y-r*1.8,r*3.6,r*3.6);
 const ring=(a,b)=>{ctx.save();ctx.strokeStyle='#d9b98f';for(const[w,al]of[[.14,.18],[.08,.5],[.03,.8]]){ctx.globalAlpha=al;ctx.lineWidth=r*w;ctx.beginPath();ctx.ellipse(x,y,r*1.4,r*.36,-.22,a,b);ctx.stroke();}ctx.restore();};
 if(p.kind==='gas')ring(Math.PI,Math.PI*2);
 const sz=r*360/178;ctx.drawImage(getSprite(index),x-sz/2,y-sz/2,sz,sz);
 if(p.kind==='gas')ring(0,Math.PI);
}

function drawFlight(){
 rect(0,0,W,H,'#050b15');
 // Псевдо-3D: чем меньше z, тем дальше точка от центра экрана.
 for(const s of stars){
  if(thrusting&&!braking)s.z-=.008+speed*.018;else s.z-=.0015;
  if(s.z<.18){s.z=1.75;s.x=(Math.random()*2-1);s.y=(Math.random()*2-1);}
  const z=Math.max(.18,s.z);
  const sx=W/2+((s.x-yaw*.55)/z)*58;
  const sy=122+((s.y-pitch*.55)/z)*48;
  if(sx>=0&&sx<W&&sy>=0&&sy<260){
   const size=Math.max(1,Math.min(3,s.size/z));
   ctx.fillStyle=`rgba(188,225,235,${Math.max(.35,1-z*.28)})`;ctx.beginPath();ctx.arc(sx,sy,size*.5,0,6.283);ctx.fill();
   if(thrusting&&!braking&&speed>.35){line(sx,sy,sx-(s.x-yaw*.55)*speed*4,sy-(s.y-pitch*.55)*speed*4,'#557b8c');}
  }
 }
 const px=W/2+(0.16-yaw)*105+Math.sin(frame*.0007+targetIndex)*14;
 const py=122+(0.02-pitch)*82;

  const ddx=Math.abs(1/(dx||.0001)),ddy=Math.abs(1/(dy||.0001));

  let side=0,hit=false,d=12;

   if(ax<ay){ax+=ddx;mx+=sx;side=0;}else{ay+=ddy;my+=sy;side=1;}

   if(shipMap[my][mx]==='#'){hit=true;break;}
  }
  if(hit)d=Math.max(.12,side===0?ax-ddx:ay-ddy);
  depths[i]=d;
  const wallH=Math.min(H,(H*.82)/d),top=(H-wallH)/2;

  rect(i*strip,top,strip+1,wallH,`rgb(${Math.floor(light*.48)},${Math.floor(light*.72)},${Math.floor(light*.82)})`);

  // Вертикальные ребра панелей и световые полосы на стенах.

  AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  MB=AC.createGain();const t0=AC.currentTime;MB.gain.setValueAtTime(0,t0);MB.gain.linearRampToValueAtTime(1,t0+4);MB.connect(AC.destination);
  const dly=AC.createDelay(2),fb=AC.createGain(),dl=AC.createBiquadFilter();dly.delayTime.value=.55;fb.gain.value=.5;dl.type='lowpass';dl.frequency.value=1800;dly.connect(dl);dl.connect(fb);fb.connect(dly);dl.connect(MB);MB.dly=dly;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=200;lp.Q.value=4;lp.connect(MB);MB.lp=lp;
  [[41.2,'sawtooth',.5],[43.4,'sawtooth',.5],[58.3,'triangle',.35],[82.4,'sine',.2]].forEach(([fr,ty,g])=>{const o=AC.createOscillator(),gg=AC.createGain();o.type=ty;o.frequency.value=fr;gg.gain.value=g*.12;o.connect(gg);gg.connect(lp);o.start();});
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.07;lg.gain.value=90;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
  const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const ns=AC.createBufferSource(),bp=AC.createBiquadFilter(),ng=AC.createGain(),l2=AC.createOscillator(),l2g=AC.createGain();
  ns.buffer=nb;ns.loop=true;bp.type='bandpass';bp.Q.value=6;bp.frequency.value=600;ng.gain.value=.02;ns.connect(bp);bp.connect(ng);ng.connect(MB);ns.start();MB.ng=ng;
  l2.frequency.value=.05;l2g.gain.value=400;l2.connect(l2g);l2g.connect(bp.frequency);l2.start();
 }catch(e){MB=null;}

function moveWalk(){

 if(walkForward){nx+=Math.cos(walkAngle)*step;ny+=Math.sin(walkAngle)*step;}

 if(walkLeft){nx+=Math.cos(walkAngle-Math.PI/2)*step;ny+=Math.sin(walkAngle-Math.PI/2)*step;}
 if(walkRight){nx+=Math.cos(walkAngle+Math.PI/2)*step;ny+=Math.sin(walkAngle+Math.PI/2)*step;}
 const canMove=(x,y)=>shipMap[Math.floor(y)]?.[Math.floor(x)]==='.';
 if(canMove(nx,walkY))walkX=nx;
 if(canMove(walkX,ny))walkY=ny;
}

 if(flight)showToast('РЕЖИМ ПОЛЁТА. ДЕРЖИТЕ ПЛАНЕТУ В ЦЕНТРЕ.');
 else if(walk)showToast('Вы внутри корабля. Исследуйте отсеки.');
 else if(surface)showToast('Посадка завершена. Начато исследование поверхности.');
 else{thrusting=false;braking=false;showToast('Вы вернулись в кабину.');}
}

function choosePlanet(delta){targetIndex=(targetIndex+delta+planets.length)%planets.length;distance=.92;speed=0;yaw=.16;pitch=.02;planetFound=false;showToast(`ЦЕЛЬ: ${activePlanet().name} / ${activePlanet().type}`);}
$('prevPlanetBtn').addEventListener('click',()=>choosePlanet(-1));
$('nextPlanetBtn').addEventListener('click',()=>choosePlanet(1));
$('flyBtn').addEventListener('click',()=>setMode('flight'));
$('cabinBtn').addEventListener('click',()=>setMode('cabin'));
$('walkBtn').addEventListener('click',()=>setMode('walk'));
$('walkExitBtn').addEventListener('click',()=>setMode('cabin'));
$('interactBtn').addEventListener('click',()=>{
 if(mode==='surface'){collectSample();return;}
 const near=nearestShipObject();
 if(near&&near.d<1.65){
  if(near.name==='Научная лаборатория'){openLab();return;}
  if(near.name==='Навигационный терминал'&&damaged){repair();return;}
  openPanel(`<h2>${near.name.toUpperCase()}</h2><div class="entry"><p>${near.detail}</p><div class="stat"><span>Энергия корабля</span><b>94%</b></div><div class="stat"><span>Кислород</span><b>98%</b></div><div class="stat"><span>Корпус</span><b>100%</b></div></div><p class="small">Показания демонстрационные — это параметры игрового прототипа.</p>`);
 }else showToast('Подойдите ближе к оборудованию.');
});
$('landBtn').addEventListener('click',()=>{
 if(!activePlanet().land){showToast('ПОСАДКА НЕВОЗМОЖНА: У ПЛАНЕТЫ НЕТ ТВЁРДОЙ ПОВЕРХНОСТИ.');return;}
 if(distance>.30){showToast('Планета ещё далеко. Продолжайте сближение.');return;}
 if(speed>.25){showToast('Слишком высокая скорость. Удерживайте ТОРМОЗ.');return;}
 landed=true;speed=0;surfacePlanetIndex=targetIndex;setMode('surface');
});
$('takeoffBtn').addEventListener('click',()=>{
 landed=false;distance=.22;speed=0;targetIndex=surfacePlanetIndex;setMode('flight');showToast('Корабль готов к взлёту. Удерживайте ТЯГУ.');
});
$('closeBtn').addEventListener('click',closePanel);
$('scanBtn').addEventListener('click',()=>{
 scanCount++;if(!planetFound){planetFound=true;showToast('ОБЪЕКТ ЗАНЕСЁН В КАТАЛОГ.');}
 const p=activePlanet();const proximity=distance<.3?'Орбитальная дистанция достигнута. Можно готовить подробное исследование.':'До орбиты ещё далеко. Продолжайте сближение.';
 openPanel(`<h2>РЕЗУЛЬТАТ СКАНИРОВАНИЯ</h2><div class="entry"><div class="small">КАТАЛОЖНЫЙ ОБЪЕКТ / ${String(targetIndex+1).padStart(3,'0')}</div><h3 style="color:#b9e1df;font-size:14px">${p.name}</h3><p>${p.info}</p><div class="stat"><span>Класс</span><b>${p.type}</b></div><div class="stat"><span>Метод</span><b>Спектральный анализ</b></div>${pdStats()}<div class="stat"><span>Условная дистанция</span><b>${distance.toFixed(2)} ед.</b></div><div class="stat"><span>Скорость судна</span><b>${speed.toFixed(2)} ед./с</b></div><div class="stat"><span>Посадка</span><b style="color:${p.land?'#b5e7c4':'#e2c1ce'}">${p.land?'Возможна':'Невозможна'}</b></div></div><p>${proximity}</p><p class="small">Параметры в прототипе демонстрационные, не реальные астрономические измерения.</p>`);
});
$('noteBtn').addEventListener('click',()=>{
 openPanel(`<h2>ПОЛЕВОЙ БЛОКНОТ</h2><div class="small">ЭКСПЕДИЦИЯ 01 / ЛИЧНЫЕ ЗАПИСИ</div><div class="entry"><div class="stat"><span>Объектов в каталоге</span><b>${planets.length}</b></div><div class="stat"><span>Текущая цель</span><b>${activePlanet().name}</b></div><div class="stat"><span>Сканирований</span><b>${scanCount}</b></div><div class="stat"><span>Образцов собрано</span><b>${total()}</b></div><div class="stat"><span>Исследовано планет</span><b>${explored()}/${planets.length}</b></div><div class="stat"><span>Каталог измерений</span><b>${cat.length}/${planets.length}</b></div><div class="stat"><span>Очки исследований</span><b>${rp}</b></div><div class="stat"><span>Условная дистанция</span><b>${distance.toFixed(2)} ед.</b></div></div><p>ЗАПИСИ ИССЛЕДОВАТЕЛЯ</p><textarea id="notes" placeholder="Запишите наблюдения, гипотезы или зарисовки..."></textarea><button id="saveNotes" style="width:100%">СОХРАНИТЬ ЗАПИСЬ</button><p class="small">Записи сохраняются на этом устройстве.</p>`);
 $('notes').value=notes;
 $('saveNotes').addEventListener('click',()=>{notes=$('notes').value;LS.setItem('astro_notes',notes);showToast('ЗАПИСЬ СОХРАНЕНА В БОРТОВОМ ЖУРНАЛЕ.');});
});
$('terminalBtn').addEventListener('click',()=>{
 openPanel(`<h2>БОРТОВОЙ ТЕРМИНАЛ</h2><div class="entry"><div class="small">СУДНО / ASTR-01</div><h3 style="font-size:13px;color:#c5e4e2">«Астрограф»</h3><p>Автоматическое исследовательское судно. Экипаж: 1 научный специалист.</p></div><div class="stat"><span>Состояние корпуса</span><b>100%</b></div><div class="stat"><span>Энергия</span><b>${Math.round(power)}%</b></div><div class="stat"><span>Кислород</span><b>98%</b></div><div class="stat"><span>Цель навигации</span><b>${activePlanet().name}</b></div><div class="stat"><span>Условная дистанция</span><b>${distance.toFixed(2)} ед.</b></div><div class="stat"><span>Связь с Центром</span><b style="color:#d7c18d">${total()>=5?'Слабый сигнал':'Нет сигнала'}</b></div><p>${centerMsg()}</p><button id="musBtn" style="width:100%">МУЗЫКА: ${musicOn?'ВКЛ':'ВЫКЛ'}</button><button id=\"skrBtn\" style=\"width:100%;margin-top:6px\">СКРИМЕРЫ: ${scareOn?'ВКЛ':'ВЫКЛ'}</button>`);
});

function holdButton(id,onStart,onEnd){
 const el=$(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);onStart();});
 el.addEventListener('pointerup',e=>{e.preventDefault();onEnd();});
 el.addEventListener('pointercancel',onEnd);
 el.addEventListener('lostpointercapture',onEnd);
}
holdButton('thrustBtn',()=>{thrusting=true;braking=false;},()=>{thrusting=false;});
holdButton('brakeBtn',()=>{braking=true;thrusting=false;},()=>{braking=false;});

canvas.addEventListener('pointerdown',e=>{
 if(!['flight','walk','surface'].includes(mode)||$('panel').style.display==='block')return;
 dragPointer=e.pointerId;lastPointerX=e.clientX;lastPointerY=e.clientY;
 canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
 if(!['flight','walk','surface'].includes(mode)||dragPointer!==e.pointerId)return;
 const rect=canvas.getBoundingClientRect();
 const dx=(e.clientX-lastPointerX)*W/rect.width;
 const dy=(e.clientY-lastPointerY)*H/rect.height;
 lastPointerX=e.clientX;lastPointerY=e.clientY;
 if(mode==='flight'){
  yaw=Math.max(-1.1,Math.min(1.1,yaw+dx*.006));
  pitch=Math.max(-.75,Math.min(.75,pitch+dy*.006));
 }else if(mode==='walk'){walkAngle+=dx*.008;}
 else{surfaceX+=dx*.006;}
});
function endDrag(e){if(dragPointer===e.pointerId)dragPointer=null;}
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('lostpointercapture',endDrag);

holdButton('forwardBtn',()=>{if(mode==='walk')walkForward=true;else surfaceForward=true;},()=>{walkForward=false;surfaceForward=false;});
holdButton('backBtn',()=>{if(mode==='walk')walkBack=true;else surfaceBack=true;},()=>{walkBack=false;surfaceBack=false;});
holdButton('leftBtn',()=>{if(mode==='walk')walkLeft=true;else surfaceLeft=true;},()=>{walkLeft=false;surfaceLeft=false;});
holdButton('rightBtn',()=>{if(mode==='walk')walkRight=true;else surfaceRight=true;},()=>{walkRight=false;surfaceRight=false;});

update();
})();
</script>
</body>
</html>
